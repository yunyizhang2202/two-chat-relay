name: Expand verified v1 baseline source archive
on:
  push:
    branches: [main]
    paths:
      - 'packages/v1.0.0-chrome.zip'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract exact allowlisted extension files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          allowed={'background.js','content.js','relay_core.js','popup.js','style.css','demo.js'}
          archive=Path('packages/v1.0.0-chrome.zip')
          with ZipFile(archive) as z:
              names=set(z.namelist())
              if not allowed.issubset(names):
                  raise RuntimeError('Missing required baseline files')
              for name in sorted(allowed):
                  Path(name).write_bytes(z.read(name))
          PY
      - name: Commit baseline files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add background.js content.js relay_core.js popup.js style.css demo.js
          git diff --cached --quiet || git commit -m "source: expand tested v1.0 extension baseline"
          git push
